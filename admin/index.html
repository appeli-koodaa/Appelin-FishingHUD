<!DOCTYPE html>
<html lang="fi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appelin FishingHUD - Admin</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <div class="container">

        <h1>🎣 Appelin FishingHUD</h1>
        <p class="subtitle">Hallintapaneeli</p>

        <div class="card">

            <h2>🐟 Hauki</h2>

            <div class="controls">

                <button id="pikeMinus">−</button>

                <span id="pikeCount">0</span>

                <button id="pikePlus">+</button>

            </div>

        </div>

        <div class="card">

            <h2>🐟 Kuha</h2>

            <div class="controls">

                <button id="zanderMinus">−</button>

                <span id="zanderCount">0</span>

                <button id="zanderPlus">+</button>

            </div>

        </div>

        <div class="card">

            <h2>🐟 Ahven</h2>

            <div class="controls">

                <button id="perchMinus">−</button>

                <span id="perchCount">0</span>

                <button id="perchPlus">+</button>

            </div>

        </div>

        <button class="reset" id="resetButton">
            🔄 Nollaa saalis
        </button>

        <div class="status">

            <div class="status-dot"></div>

            <span>Paikallinen testiversio</span>

        </div>

    </div>

    <script type="module" src="admin.js"></script>

</body>

</html>
