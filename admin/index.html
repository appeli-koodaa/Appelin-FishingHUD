<!DOCTYPE html>
<html lang="fi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appelin FishingHUD - Admin</title>

    <link rel="stylesheet" href="admin.css">

</head>


<body>

<div class="container">


    <h1>🎣 Appelin FishingHUD</h1>

    <p class="subtitle">
        Hallintapaneeli
    </p>



    <!-- ==================================================
         KIRJAUTUMINEN
    =================================================== -->

    <div class="card login">

        <h2>🔐 Kirjautuminen</h2>


        <input
            id="email"
            type="email"
            placeholder="Sähköposti"
        >


        <input
            id="password"
            type="password"
            placeholder="Salasana"
        >


        <button id="loginButton">
            Kirjaudu
        </button>


        <p id="loginStatus">
            Ei kirjautunut
        </p>


    </div>



    <!-- ==================================================
         Hauki
    =================================================== -->

    <div class="card pike">

        <h2>🐟 Hauki</h2>


        <div class="controls">

            <button id="pikeMinus">
                −
            </button>


            <span id="pikeCount">
                0
            </span>


            <button id="pikePlus">
                +
            </button>


        </div>

    </div>




    <!-- ==================================================
         Kuha
    =================================================== -->

    <div class="card zander">

        <h2>🐟 Kuha</h2>


        <div class="controls">


            <button id="zanderMinus">
                −
            </button>


            <span id="zanderCount">
                0
            </span>


            <button id="zanderPlus">
                +
            </button>


        </div>

    </div>




    <!-- ==================================================
         Ahven
    =================================================== -->

    <div class="card perch">

        <h2>🐟 Ahven</h2>


        <div class="controls">


            <button id="perchMinus">
                −
            </button>


            <span id="perchCount">
                0
            </span>


            <button id="perchPlus">
                +
            </button>


        </div>

    </div>




    <!-- ==================================================
         Reset
    =================================================== -->

    <button class="reset" id="resetButton">

        🔄 Nollaa saalis

    </button>




    <!-- ==================================================
         GPS STATUS
    =================================================== -->

    <div class="status">


        <div
            class="status-dot"
            id="gpsStatus">
        </div>


        <span id="gpsText">
            Käynnistetään GPS...
        </span>


    </div>



</div>



<script
    type="module"
    src="admin.js">
</script>


</body>

</html>
